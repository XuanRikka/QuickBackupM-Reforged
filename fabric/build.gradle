plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    Set<String> apiModules = [
            "fabric-command-api-v2",
            "fabric-lifecycle-events-v1",
    ]

    apiModules.forEach {
        include(implementation(fabricApi.module(it, rootProject.fabric_api_version)))
    }

    common(project(path: ":${mod_id}-common:")) { transitive false }
    shadowBundle project(path: ":${mod_id}-common", configuration: "transformProductionFabric")

    implementation("net.fabricmc:fabric-language-kotlin:1.13.13+kotlin.2.4.10")

    include("org.quartz-scheduler:quartz:2.5.0")

    include("io.github.skydynamic:incremental-storage-lib:$rootProject.incremental_storage_lib_version")
    include("org.jetbrains.exposed:exposed-core:0.57.0")
    include("org.jetbrains.exposed:exposed-jdbc:0.57.0")
    include("com.h2database:h2:2.2.224")
}

processResources {
    def minecraftRange = minecraftFabricRange(project.minecraft_supported_versions)

    inputs.property "version", project.version
    inputs.property "minecraft_range", minecraftRange

    filesMatching("fabric.mod.json") {
        expand version: project.version, minecraft_range: minecraftRange
    }
}

// With loom-no-remap there is no remapJar: shadowJar itself becomes the final artifact.
// It unpacks the plain jar output so Loom's modifications (e.g. nested-jar entries in
// fabric.mod.json) are preserved, then merges the common module classes on top.
jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}
